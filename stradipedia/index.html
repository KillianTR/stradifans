<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradipedia · StradiFans</title>
  <meta name="description" content="Memes, coñas y personajes del canal de Stradi.">
  <meta name="theme-color" content="#061b2a">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page">
    <p class="crumbs"><a href="/">Inicio</a> › Stradipedia</p>
    <h1>Stradipedia</h1>
    <p class="page-sub">Todo lo que sabe el chat, clasificado por licencia de iRacing.</p>
    <div class="pedia-controls">
      <label class="faq-search pedia-search">
        <svg viewBox="0 0 21 21" aria-hidden="true"><circle cx="8.2" cy="8.2" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12l6.3 6.3" stroke="currentColor" stroke-width="2"/></svg>
        <span class="sr-only">Buscar en la Stradipedia</span>
        <input type="search" id="pediaSearch" placeholder="Buscar en el paddock… prueba «Saxo»" autocomplete="off">
      </label>
      <div class="pedia-lics" id="pediaFilters" role="group" aria-label="Licencia"></div>
    </div>
    <p class="faq-count mono" id="pediaCount" aria-live="polite"></p>
    <div class="pedia-list" id="pediaGrid"></div>
    <img class="pedia-peek" id="pediaPeek" alt="" hidden>
  </section>

  <section class="page-section">
    <div class="section-head"><span class="tag">Chat</span><h2>Emotes del canal</h2></div>
    <p class="section-sub">Los emotes de Stradi que más se ven en el chat.</p>
    <div class="emote-grid" id="emoteGrid"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/data.js"></script>
<script src="/chat.js"></script>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
