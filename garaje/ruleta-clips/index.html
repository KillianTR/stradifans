<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de clips · StradiFans</title>
  <meta name="description" content="Abre una caja y te toca un clip aleatorio de Stradi.">
  <meta name="theme-color" content="#061b2a">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page">
    <p class="crumbs"><a href="/">Inicio</a> › <a href="/garaje/">Garaje</a> › Ruleta de clips</p>
    <h1>Abre la caja</h1>
    <p class="page-sub">Gira la ruleta y te toca un clip aleatorio de Stradi. Cuantas más visitas tiene el clip, más difícil es que salga.</p>

    <div class="page-grid">
      <div>
        <div class="panel">
          <div class="case-window">
            <div class="case-marker"></div>
            <div class="case-strip" id="strip"></div>
          </div>
          <div class="case-actions">
            <button class="btn btn-primary" id="spinBtn" disabled>Cargando clips...</button>
            <button class="btn btn-ghost sound-toggle" id="soundBtn" aria-pressed="true">Sonido: sí</button>
            <a class="btn btn-ghost" href="https://www.twitch.tv/stradi/clips?range=all" target="_blank" rel="noopener">Ver clips en Twitch</a>
          </div>
          <p class="notice" id="notice" hidden></p>
          <div class="case-result" id="result" hidden>
            <span class="tier-badge" id="resTier"></span>
            <h3 class="res-title" id="resTitle"></h3>
            <p class="meta" id="resMeta"></p>
            <div class="player" id="resPlayer"></div>
          </div>
        </div>
      </div>
      <aside class="panel">
        <div class="panel-head"><h2>Probabilidades</h2></div>
        <ul class="odds" id="odds"></ul>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/data.js"></script>
<script src="/chat.js"></script>
<script src="/common.js"></script>

<script>
(function () {
  const S = window.SITE, esc = window.StradiChat.esc;
  const $ = (id) => document.getElementById(id);
  const tiers = S.clipTiers;
  const ITEM_W = 208; // 200px card + 8px gap
  const fmtViews = (n) => n.toLocaleString("es-ES");
  const tierFor = (views) => tiers.find((t) => views >= t.min) || tiers[tiers.length - 1];

  /* Odds list */
  $("odds").innerHTML = tiers.map((t, i) => {
    const max = i > 0 ? tiers[i - 1].min : null;
    const range = max ? `${fmtViews(t.min)}–${fmtViews(max)} visitas` : `${fmtViews(t.min)}+ visitas`;
    return `<li><span class="sw" style="background:${t.color}"></span><span>${esc(t.name)}<br><small>${range}</small></span><span class="pct">${t.odds.toFixed(2)}%</span></li>`;
  }).join("");

  let byTier = {}, all = [];

  function rollTier(available) {
    const pool = tiers.filter((t) => available.has(t.id));
    const sum = pool.reduce((a, t) => a + t.odds, 0);
    let r = Math.random() * sum;
    for (const t of pool) { if ((r -= t.odds) <= 0) return t; }
    return pool[pool.length - 1];
  }
  const randomClip = () => {
    const t = rollTier(new Set(Object.keys(byTier)));
    const list = byTier[t.id];
    return list[Math.floor(Math.random() * list.length)];
  };

  function card(c) {
    const t = tierFor(c.views);
    return `<div class="case-item" style="border-bottom-color:${t.color}"><img src="${esc(c.thumb)}" alt="" loading="lazy"><span>${esc(c.title)}</span></div>`;
  }

  /* Case sounds (synthesised with Web Audio, no files): unlock, a tick per clip, and a reveal by tier */
  const Sfx = (() => {
    let ctx = null, out = null, on = true, noise = null;
    try { on = localStorage.getItem("sf_roulette_sound") !== "off"; } catch (_) {}
    const init = () => {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC(); out = ctx.createGain(); out.gain.value = 0.45; out.connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    };
    const tone = (freq, at, dur, type = "sine", vol = 0.5) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g).connect(out); o.start(at); o.stop(at + dur + 0.02);
    };
    const burst = (at, dur, freq, vol) => {
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 2;
      g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      s.connect(f).connect(g).connect(out); s.start(at); s.stop(at + dur);
    };
    return {
      get on() { return on; },
      toggle() { on = !on; try { localStorage.setItem("sf_roulette_sound", on ? "on" : "off"); } catch (_) {} return on; },
      unlock() {
        if (!on || !init()) return;
        const t = ctx.currentTime;
        burst(t, 0.06, 3200, 0.8); tone(520, t, 0.08, "square", 0.12);
        burst(t + 0.09, 0.12, 1800, 0.6); tone(880, t + 0.09, 0.18, "triangle", 0.25);
      },
      tick() {
        if (!on || !ctx) return;
        const t = ctx.currentTime;
        burst(t, 0.03, 4200, 0.5); tone(1500 + Math.random() * 120, t, 0.035, "square", 0.08);
      },
      reveal(rank) { // rank 0 = lowest tier
        if (!on || !ctx) return;
        const t = ctx.currentTime;
        const notes = [[392, 523], [440, 554, 659], [523, 659, 784], [587, 740, 880, 1175], [659, 831, 988, 1319, 1661]][Math.min(rank, 4)];
        notes.forEach((f, i) => { tone(f, t + i * 0.09, 0.5 + rank * 0.12, "triangle", 0.3); tone(f * 2, t + i * 0.09, 0.25, "sine", 0.08); });
        if (rank >= 3) burst(t, 0.6, 6000, 0.25);
      }
    };
  })();
  const syncSoundBtn = () => { $("soundBtn").textContent = Sfx.on ? "Sonido: sí" : "Sonido: no"; $("soundBtn").setAttribute("aria-pressed", String(Sfx.on)); };
  syncSoundBtn();
  $("soundBtn").addEventListener("click", () => { Sfx.toggle(); syncSoundBtn(); });

  let spinning = false;
  function spin() {
    if (spinning || !all.length) return;
    spinning = true;
    $("spinBtn").disabled = true;
    $("result").hidden = true;
    $("resPlayer").innerHTML = "";

    const WIN_AT = 40;
    const winner = randomClip();
    const items = [];
    for (let i = 0; i < WIN_AT + 6; i++) items.push(i === WIN_AT ? winner : randomClip());

    const strip = $("strip");
    strip.style.transition = "none";
    strip.style.transform = "translateX(0)";
    strip.innerHTML = items.map(card).join("");
    void strip.offsetWidth; // restart

    const windowW = strip.parentElement.clientWidth;
    const jitter = (Math.random() - 0.5) * 150;
    const offset = WIN_AT * ITEM_W + 100 - windowW / 2 + jitter;
    Sfx.unlock();
    strip.style.transition = "transform 6s cubic-bezier(.12,.75,.15,1)";
    strip.style.transform = `translateX(${-offset}px)`;

    // One tick each time a clip crosses the marker
    let lastIdx = Math.floor((windowW / 2) / ITEM_W);
    const watch = () => {
      if (!spinning) return;
      const x = new DOMMatrixReadOnly(getComputedStyle(strip).transform).m41;
      const idx = Math.floor((windowW / 2 - x) / ITEM_W);
      if (idx !== lastIdx) { lastIdx = idx; Sfx.tick(); }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);

    setTimeout(() => {
      spinning = false;
      $("spinBtn").disabled = false;
      $("spinBtn").textContent = "Abrir otra caja";
      showResult(winner);
    }, 6200);
  }

  function showResult(c) {
    const t = tierFor(c.views);
    Sfx.reveal(tiers.length - 1 - tiers.indexOf(t));
    $("resTier").textContent = t.name;
    $("resTier").style.background = t.color;
    $("resTitle").textContent = c.title;
    $("resMeta").textContent = `${fmtViews(c.views)} visitas · clip de ${c.creator} · ${new Date(c.date).toLocaleDateString("es-ES")}`;
    // Reveal the title first; the clip only loads when the user presses play
    $("resPlayer").innerHTML =
      `<button class="clip-cover" id="playClip" style="background-image:url('${esc(c.thumb)}')">` +
      `<span class="clip-play">&#9654;</span><span class="clip-cover-title">${esc(c.title)}</span></button>`;
    $("playClip").addEventListener("click", () => {
      const host = location.hostname || "localhost";
      $("resPlayer").innerHTML = `<iframe src="https://clips.twitch.tv/embed?clip=${encodeURIComponent(c.id)}&parent=${encodeURIComponent(host)}&autoplay=true" allowfullscreen></iframe>`;
    });
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function showNotice(msg) { $("notice").textContent = msg; $("notice").hidden = false; }

  fetch("/api/clips?extra=" + encodeURIComponent((S.rouletteClips || []).join(",")))
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok || !d.clips || !d.clips.length) {
        showNotice(d && d.error === "not_configured"
          ? "La ruleta aún no está conectada a Twitch. ¡Vuelve pronto!"
          : "No se han podido cargar los clips ahora mismo. Prueba en un rato.");
        $("spinBtn").textContent = "Sin clips";
        return;
      }
      all = d.clips;
      all.forEach((c) => { const t = tierFor(c.views); (byTier[t.id] = byTier[t.id] || []).push(c); });
      $("strip").innerHTML = Array.from({ length: 12 }, randomClip).map(card).join("");
      $("spinBtn").disabled = false;
      $("spinBtn").textContent = "Abrir caja";
    })
    .catch(() => {
      showNotice("No se han podido cargar los clips ahora mismo. Prueba en un rato.");
      $("spinBtn").textContent = "Sin clips";
    });

  $("spinBtn").addEventListener("click", spin);
})();
</script>
</body>
</html>
